name: Build check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run architecture
      - run: npm run check
      - run: npm run golden
      # сборка не должна давать предупреждений о неразрешённых путях (так однажды потерялся фон)
      - name: Build without resolve warnings
        run: |
          npm run build 2>&1 | tee build.log
          ! grep -i "didn't resolve" build.log
